<!doctype html>
<meta charset="utf-8">
<title>GRAVASSIST — parity check</title>
<style>
  body { font: 14px/1.5 monospace; background:#111; color:#ddd; padding:1.5rem; }
  h1 { font-size:1.1rem; }
  .ok   { color:#4f4; } .bad { color:#f66; }
  table { border-collapse:collapse; margin-top:1rem; }
  td,th { border:1px solid #444; padding:.2rem .6rem; text-align:right; }
  th { color:#999; font-weight:normal; }
</style>
<h1>Model parity: Python and JavaScript</h1>
<p id="status">Loading…</p>
<div id="detail"></div>

<script src="data.js"></script>
<script src="physics.js"></script>
<script>
// Τρέχει το ΙΔΙΟ σενάριο με το tools/parity.py και συγκρίνει frame προς frame.
// Η πρώτη απόκλιση τυπώνεται αναλυτικά: σε 800 frames, το να ξέρεις ΠΟΥ
// χώρισαν οι δρόμοι είναι όλη η πληροφορία.
(async function () {
  const st = document.getElementById("status");
  const dt = document.getElementById("detail");
  let exp;
  try {
    exp = await (await fetch("parity-expected.json")).json();
  } catch (e) {
    st.className = "bad";
    st.textContent = "parity-expected.json is missing — run: python3 tools/parity.py";
    return;
  }

  const room = new GRAV.Room(exp.room);
  const h = new GRAV.Hero(room, exp.start[0], exp.start[1], exp.start[2]);
  const script = new Map(exp.script.map(([f, a]) => [f, a]));
  let walk = 0;
  const got = [];
  for (let f = 0; f < exp.frames; f++) {
    const act = script.get(f);
    if (act) {
      if ("grav" in act) h.setGravity(act.grav);
      if ("walk" in act) walk = act.walk;
    }
    h.update(walk);
    got.push([h.x, h.y, h.g, h.state, h.energy, h.fallDist]);
  }

  const cols = ["x", "y", "gravity", "state", "energy", "fall height"];
  let bad = -1;
  for (let f = 0; f < exp.frames && bad < 0; f++)
    for (let i = 0; i < cols.length; i++)
      if (String(got[f][i]) !== String(exp.trace[f][i])) { bad = f; break; }

  window.PARITY = { ok: bad < 0, frame: bad, got, expected: exp.trace };
  if (bad < 0) {
    st.className = "ok";
    st.textContent = `MATCH — ${exp.frames} frames, all fields.`;
    return;
  }
  st.className = "bad";
  st.textContent = `MISMATCH at frame ${bad}.`;
  let html = "<table><tr><th>field</th><th>Python</th><th>JavaScript</th></tr>";
  cols.forEach((c, i) => {
    const a = exp.trace[bad][i], b = got[bad][i];
    html += `<tr><th>${c}</th><td>${a}</td>` +
            `<td class="${String(a) === String(b) ? "" : "bad"}">${b}</td></tr>`;
  });
  html += "</table>";
  if (bad > 0) {
    html += `<p>The previous frame (${bad - 1}) was still identical: ` +
            `x=${exp.trace[bad-1][0]} y=${exp.trace[bad-1][1]} ` +
            `g=${exp.trace[bad-1][2]} ${exp.trace[bad-1][3]}</p>`;
  }
  dt.innerHTML = html;
})();
</script>
